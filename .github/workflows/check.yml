name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-build.txt openpyxl==3.1.5
      - run: python -m unittest discover -v
      - run: python verify_formats.py .cache/ci-matrix
      - run: python scripts/build.py --dist-dir dist/ci-smoke
